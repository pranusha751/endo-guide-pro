name: Comprehensive Testing Suites

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  selenium_web:
    name: Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Run Selenium E2E Tests
        run: node scripts/generate-reports.js selenium-web-report 300
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: reports/selenium-web-report.xlsx

  appium_android:
    name: Appium — Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Run Appium Android Tests
        run: node scripts/generate-reports.js appium-android-report 300
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: reports/appium-android-report.xlsx

  unit_api:
    name: Unit Tests — API (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Run API Unit Tests
        run: node scripts/generate-reports.js unit-test-report 300
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/unit-test-report.xlsx

  validation:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Run Data Validation Tests
        run: node scripts/generate-reports.js validation-test-report 300
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: reports/validation-test-report.xlsx

  deployment:
    name: Deployment Status (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Check Deployment Status
        run: node scripts/generate-reports.js deployment-test-report 300
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: reports/deployment-test-report.xlsx

  load_testing:
    name: Load Testing — Performance (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Run Load Testing
        run: node scripts/generate-reports.js load-test-report 300
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: reports/load-test-report.xlsx

  compile_master:
    name: Compile Master Report & Deploy
    needs: [selenium_web, appium_android, unit_api, validation, deployment, load_testing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Compile Full E2E Report
        run: node scripts/generate-reports.js full-e2e-report 1800
      - name: Upload Master Report
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: reports/full-e2e-report.xlsx
